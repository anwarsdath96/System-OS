<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System OS</title>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar">
    <button class="top-tab os-tab" onclick="selectOS()" aria-label="OS Health">
      <div class="top-title">OS</div>
      <div class="top-sub">Health</div>
    </button>
    <button class="top-tab active" id="layer1Tab" onclick="selectLayer(1)">
      <div class="top-title">Personal Engine</div>
      <div class="top-sub">Daily systems</div>
    </button>
    <button class="top-tab" id="layer2Tab" onclick="selectLayer(2)">
      <div class="top-title">Productivity Engine</div>
      <div class="top-sub">Time horizons</div>
    </button>
    <button class="top-tab" id="layer3Tab" onclick="selectLayer(3)">
      <div class="top-title">Domain Engine</div>
      <div class="top-sub">Projects & skills</div>
    </button>
    <button class="top-tab" id="layer4Tab" onclick="selectLayer(4)">
      <div class="top-title">Life Engine</div>
      <div class="top-sub">Long-term</div>
    </button>
    <div class="top-right">
      <button class="small-tab active" id="dashboardTab" onclick="showPage('dashboard')">Dashboard</button>
      <button class="small-tab" id="analyticsTab" onclick="showPage('analytics')">Analytics</button>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-title" id="sidebarTitle">Overview</div>
      <div id="sidebarItems"></div>
      <div class="sidebar-account">
        <div class="sidebar-email" id="userEmail"></div>
        <button class="sidebar-logout logout-btn" onclick="logout()">Log out</button>
      </div>
    </aside>

    <main class="main" id="workspace">
      <div id="workspaceContent"></div>
      <div id="osPage" style="display:none"></div>
      <!-- Required containers for existing render logic -->
      <div id="systemPage" style="display:none">
        <section id="todayPage" style="display:none"></section>
        <section id="workoutPage" style="display:none"></section>
        <section id="simpleTrackerPage" style="display:none"></section>
        <section id="meditationPage" style="display:none"></section>
        <section id="dashboardPage" style="display:none"></section>
        <section id="analyticsPage" style="display:none"></section>
        <section id="engineDashboardPage" style="display:none"></section>
        <section id="entryHubPage" style="display:none"></section>
        <section id="overviewPage" style="display:none"></section>
        <section id="systemDefinitionPage" style="display:none"></section>
        <div id="placeholderPage" class="placeholder" style="display:none"></div>
      </div>
      <section id="gameDomainPage" style="display:none"></section>
      <section id="writingDomainPage" style="display:none"></section>
    </main>
  </div>
</div>

<!-- Auth overlay -->
<div id="authOverlay" class="auth-overlay">
  <div class="auth-card">
    <div class="auth-brand">System OS</div>
    <div class="auth-sub">Sign in to continue</div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="loginTab" onclick="setAuthMode('login')">Log in</button>
      <button class="auth-tab" id="signupTab" onclick="setAuthMode('signup')">Create account</button>
    </div>
    <div class="auth-field"><label for="authEmail">Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>
    <div class="auth-field"><label for="authPassword">Password</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="At least 6 characters"></div>
    <div class="auth-actions"><button class="auth-btn" id="authSubmit" onclick="submitAuth()">Log in</button></div>
    <div id="authMessage" class="auth-message"></div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
